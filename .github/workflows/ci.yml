name: CI Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      break_mode:
        description: "Failure to simulate"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - missing_dep
          - failing_test
          - bad_config
          - slow_deploy

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BREAK_MODE: ${{ github.event.inputs.break_mode || 'none' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pull code (log marker)
        run: echo "Pulled commit ${{ github.sha }}"

      - name: Install dependencies (BUILD stage)
        run: |
          pip install -r requirements.txt
          if [ "$BREAK_MODE" = "missing_dep" ]; then
            echo "BREAK_MODE=missing_dep -> deliberately skipping boto3 install"
          fi

      - name: Import check (surfaces missing_dep here, like a real build step)
        run: python -c "import app" 2>&1 | tee import_check.log
        continue-on-error: true

      - name: Run tests (TEST stage)
        run: pytest tests/ -v 2>&1 | tee test_output.log
        continue-on-error: true

      - name: Simulate deploy (DEPLOY stage)
        run: |
          if [ "$BREAK_MODE" = "bad_config" ]; then
            echo "Simulating missing DATABASE_URL env var at deploy time"
            python -c "import os; os.environ.pop('DATABASE_URL', None); exec(open('app.py').read())" 2>&1 | tee deploy.log
            if [ $? -ne 0 ]; then echo "DEPLOY FAILED: bad_config" | tee -a deploy.log; fi
          elif [ "$BREAK_MODE" = "slow_deploy" ]; then
            echo "Simulating a deploy health check that times out..." | tee deploy.log
            sleep 5
            echo "DEPLOY FAILED: health check timeout after 5s (simulated 300s SLA)" | tee -a deploy.log
          else
            echo "Deploy OK" | tee deploy.log
          fi
        continue-on-error: true

      - name: Capture full job log
        if: always()
        run: |
          echo "Pipeline: ${{ github.run_id }}" > pipeline_log.txt
          echo "Commit: ${{ github.sha }}" >> pipeline_log.txt
          echo "Status: ${{ job.status }}" >> pipeline_log.txt
          echo "Repo: ${{ github.repository }}" >> pipeline_log.txt
          echo "Break mode: ${{ env.BREAK_MODE }}" >> pipeline_log.txt
          echo "" >> pipeline_log.txt
          echo "--- Import check output ---" >> pipeline_log.txt
          cat import_check.log >> pipeline_log.txt 2>/dev/null || true
          echo "" >> pipeline_log.txt
          echo "--- Test output ---" >> pipeline_log.txt
          cat test_output.log >> pipeline_log.txt 2>/dev/null || true
          echo "" >> pipeline_log.txt
          echo "--- Deploy output ---" >> pipeline_log.txt
          cat deploy.log >> pipeline_log.txt 2>/dev/null || true

      - name: Configure AWS credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Upload log to S3
        if: always()
        run: |
          aws s3 cp pipeline_log.txt \
            s3://${{ secrets.AWS_S3_BUCKET }}/logs/${{ github.run_id }}.txt
