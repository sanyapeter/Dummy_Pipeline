name: CI Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      break_mode:
        description: "Failure to simulate"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - missing_dep
          - failing_test
          - bad_config
          - slow_deploy

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BREAK_MODE: ${{ github.event.inputs.break_mode || 'none' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: BUILD - import check
        id: build_check
        continue-on-error: true
        run: python -c "import app" > build.log 2>&1

      - name: TEST - pytest
        id: test_check
        continue-on-error: true
        run: python -m pytest tests/ -v > test.log 2>&1

      - name: DEPLOY - simulated deploy
        id: deploy_check
        continue-on-error: true
        run: python deploy_check.py > deploy.log 2>&1

      - name: Assemble pipeline_log.txt
        if: always()
        run: |
          echo "Pipeline: ${{ github.run_id }}" > pipeline_log.txt
          echo "Commit: ${{ github.sha }}" >> pipeline_log.txt
          echo "Repo: ${{ github.repository }}" >> pipeline_log.txt
          echo "Break mode: ${{ env.BREAK_MODE }}" >> pipeline_log.txt
          echo "" >> pipeline_log.txt
          echo "--- BUILD ---" >> pipeline_log.txt
          cat build.log >> pipeline_log.txt
          echo "" >> pipeline_log.txt
          echo "--- TEST ---" >> pipeline_log.txt
          cat test.log >> pipeline_log.txt
          echo "" >> pipeline_log.txt
          echo "--- DEPLOY ---" >> pipeline_log.txt
          cat deploy.log >> pipeline_log.txt
          echo "" >> pipeline_log.txt
          echo "Build outcome: ${{ steps.build_check.outcome }}" >> pipeline_log.txt
          echo "Test outcome: ${{ steps.test_check.outcome }}" >> pipeline_log.txt
          echo "Deploy outcome: ${{ steps.deploy_check.outcome }}" >> pipeline_log.txt
          cat pipeline_log.txt

      - name: Configure AWS credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Upload log to S3
        if: always()
        run: |
          aws s3 cp pipeline_log.txt \
            s3://${{ secrets.AWS_S3_BUCKET }}/logs/${{ github.run_id }}.txt

      - name: Fail the job if any stage failed
        if: always()
        run: |
          if [ "${{ steps.build_check.outcome }}" = "failure" ] || \
             [ "${{ steps.test_check.outcome }}" = "failure" ] || \
             [ "${{ steps.deploy_check.outcome }}" = "failure" ]; then
            echo "One or more stages failed - see the log above / in S3."
            exit 1
          fi
          echo "All stages passed."
